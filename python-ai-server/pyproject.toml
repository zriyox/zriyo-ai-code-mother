[project]
name = "python-ai-server"
version = "0.1.0"
description = "Python AI Server - Agent 执行层"
authors = [
    {name = "Zriyo AI", email = "dev@zriyo.com"}
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
